<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ config.COMMUNITY_NAME }}{% endblock %}</title>
    {% if config.FAVICON %}
    <link rel="icon" type="image/x-icon" href="{{ MEDIA_URL }}{{ config.FAVICON }}">
    <link rel="shortcut icon" type="image/x-icon" href="{{ MEDIA_URL }}{{ config.FAVICON }}">
    {% endif %}
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --primary-color: {{ config.PRIMARY_COLOR }};
            --secondary-color: {{ config.SECONDARY_COLOR }};
        }
        .bg-primary-brand { background-color: var(--primary-color); }
        .text-primary-brand { color: var(--primary-color); }
        .border-primary-brand { border-color: var(--primary-color); }
        .bg-secondary-brand { background-color: var(--secondary-color); }
        .text-secondary-brand { color: var(--secondary-color); }
        
        .btn-primary-brand {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background-color: var(--primary-color);
            color: #fff;
            padding: 0.75rem 2rem;
            border-radius: 0.75rem;
            font-weight: 600;
            transition: all 0.2s ease;
            text-decoration: none;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .btn-primary-brand:hover { 
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        
        .category-header { 
            border-left: 4px solid var(--primary-color); 
            padding-left: 1rem;
            background: linear-gradient(to right, rgba(0,0,0,0.02), transparent);
            padding-top: 0.5rem;
            padding-bottom: 0.5rem;
        }
        
        .gradient-bg {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .animate-fade-in-up {
            animation: fadeInUp 0.6s ease-out forwards;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen bg-gradient-to-br from-gray-50 via-white to-gray-50">

<main class="container mx-auto px-4 lg:px-8 py-8 mb-12 flex-grow">
    {% if messages %}
        {% for message in messages %}
            <div class="mb-4 px-4 py-3 rounded border flex items-center justify-between
                {% if message.tags == 'error' %}bg-red-50 border-red-300 text-red-800
                {% elif message.tags == 'success' %}bg-green-50 border-green-300 text-green-800
                {% elif message.tags == 'warning' %}bg-yellow-50 border-yellow-300 text-yellow-800
                {% else %}bg-blue-50 border-blue-300 text-blue-800{% endif %}" role="alert">
                <span>{{ message }}</span>
                <button type="button" class="dismiss-alert ml-4 text-current opacity-60 hover:opacity-100 text-xl leading-none focus:outline-none focus:ring-2 focus:ring-current rounded" aria-label="Dismiss">&times;</button>
            </div>
        {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
</main>

<script>
    document.querySelectorAll('.dismiss-alert').forEach(btn => {
        btn.addEventListener('click', () => btn.closest('[role="alert"]').remove());
    });
</script>
</body>
</html>
