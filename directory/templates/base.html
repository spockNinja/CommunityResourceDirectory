<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ config.COMMUNITY_NAME }}{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --primary-color: {{ config.PRIMARY_COLOR }};
            --secondary-color: {{ config.SECONDARY_COLOR }};
        }
        .bg-primary-brand { background-color: var(--primary-color); }
        .text-primary-brand { color: var(--primary-color); }
        .border-primary-brand { border-color: var(--primary-color); }
        .bg-secondary-brand { background-color: var(--secondary-color); }
        .btn-primary-brand {
            display: inline-block;
            background-color: var(--primary-color);
            color: #fff;
            padding: 0.5rem 1.25rem;
            border-radius: 0.375rem;
            font-weight: 600;
            transition: filter 0.15s ease;
            text-decoration: none;
        }
        .btn-primary-brand:hover { filter: brightness(0.9); color: #fff; }
        .category-header { border-left: 4px solid var(--primary-color); padding-left: 0.75rem; }
    </style>
</head>
<body class="flex flex-col min-h-screen bg-gray-50">

<nav class="bg-primary-brand shadow-md mb-6">
    <div class="container mx-auto px-4">
        <div class="flex items-center justify-between h-16">
            <a class="text-xl font-bold text-white tracking-wide" href="{% url 'index' %}">{{ config.COMMUNITY_NAME }}</a>
            <button id="menu-btn" class="md:hidden text-white focus:outline-none focus:ring-2 focus:ring-white rounded" aria-label="Toggle navigation menu">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                </svg>
            </button>
            <ul class="hidden md:flex md:items-center md:gap-6 list-none">
                <li><a class="text-white hover:text-gray-200 transition-colors" href="{% url 'index' %}">Home</a></li>
                <li><a class="text-white hover:text-gray-200 transition-colors" href="{% url 'submit' %}">Submit Organization</a></li>
            </ul>
        </div>
        <div id="mobile-menu" class="hidden md:hidden pb-3 border-t border-white border-opacity-20">
            <a class="block text-white hover:text-gray-200 py-2 transition-colors" href="{% url 'index' %}">Home</a>
            <a class="block text-white hover:text-gray-200 py-2 transition-colors" href="{% url 'submit' %}">Submit Organization</a>
        </div>
    </div>
</nav>

<main class="container mx-auto px-4 mb-12 flex-grow">
    {% if messages %}
        {% for message in messages %}
            <div class="mb-4 px-4 py-3 rounded border flex items-center justify-between
                {% if message.tags == 'error' %}bg-red-50 border-red-300 text-red-800
                {% elif message.tags == 'success' %}bg-green-50 border-green-300 text-green-800
                {% elif message.tags == 'warning' %}bg-yellow-50 border-yellow-300 text-yellow-800
                {% else %}bg-blue-50 border-blue-300 text-blue-800{% endif %}" role="alert">
                <span>{{ message }}</span>
                <button type="button" class="dismiss-alert ml-4 text-current opacity-60 hover:opacity-100 text-xl leading-none focus:outline-none focus:ring-2 focus:ring-current rounded" aria-label="Dismiss">&times;</button>
            </div>
        {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
</main>

<footer class="bg-gray-100 border-t border-gray-200 py-4 mt-auto">
    <div class="container mx-auto px-4 text-center text-gray-500 text-sm">
        &copy; {{ config.COMMUNITY_NAME }}. All rights reserved.
    </div>
</footer>

<script>
    const menuBtn = document.getElementById('menu-btn');
    const mobileMenu = document.getElementById('mobile-menu');
    if (menuBtn && mobileMenu) {
        menuBtn.addEventListener('click', () => mobileMenu.classList.toggle('hidden'));
    }
    document.querySelectorAll('.dismiss-alert').forEach(btn => {
        btn.addEventListener('click', () => btn.closest('[role="alert"]').remove());
    });
</script>
</body>
</html>
